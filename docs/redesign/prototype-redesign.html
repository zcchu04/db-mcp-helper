<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB MCP Helper · Redesign Prototype</title>
<style>
/* ==========================================================================
   Design Tokens
   ========================================================================== */
:root {
  --bg-canvas:#f8fafc; --bg-elevated:#ffffff; --bg-inset:#f1f5f9; --bg-hover:#eff6ff;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --text-primary:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8;
  --brand:#2563eb; --brand-hover:#1d4ed8; --brand-soft:#dbeafe;
  --success:#059669; --success-soft:#d1fae5;
  --warning:#d97706; --warning-soft:#fef3c7;
  --danger:#dc2626;  --danger-soft:#fee2e2;
  --info:#0891b2;    --info-soft:#cffafe;
  --sh-card: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  --sh-pop:  0 8px 24px rgba(15,23,42,.10), 0 2px 6px rgba(15,23,42,.05);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --sidebar-w:240px; --sidebar-w-collapsed:64px; --topbar-h:48px;
  --font-ui:"Inter","-apple-system","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Code","Consolas",monospace;
}
html[data-theme="dark"] {
  --bg-canvas:#0b1220; --bg-elevated:#111827; --bg-inset:#0f172a; --bg-hover:#1e293b;
  --border:#1f2937; --border-strong:#334155;
  --text-primary:#f8fafc; --text-secondary:#cbd5e1; --text-muted:#94a3b8;
  --brand:#3b82f6; --brand-hover:#60a5fa; --brand-soft:#1e3a8a;
  --success:#10b981; --success-soft:#064e3b;
  --warning:#f59e0b; --warning-soft:#78350f;
  --danger:#ef4444;  --danger-soft:#7f1d1d;
  --info:#06b6d4;    --info-soft:#164e63;
  --sh-card: 0 1px 2px rgba(0,0,0,.3);
  --sh-pop:  0 8px 24px rgba(0,0,0,.5);
}

/* ==========================================================================
   Base
   ========================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--font-ui); font-size:13px; line-height:1.6;
  background:var(--bg-canvas); color:var(--text-primary); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; font-size:inherit; }
input,select,textarea{ font-family:inherit; }

/* ==========================================================================
   App shell
   ========================================================================== */
#app{ display:flex; flex-direction:column; height:100vh; }
.topbar{
  height:var(--topbar-h); display:flex; align-items:center; gap:var(--s3);
  padding:0 var(--s5); background:var(--bg-elevated); border-bottom:1px solid var(--border);
  flex-shrink:0; user-select:none;
}
.topbar .brand{ display:flex; align-items:center; gap:var(--s2); font-weight:600; font-size:14px; }
.topbar .brand-mark{ width:24px; height:24px; border-radius:var(--r-sm); background:linear-gradient(135deg,var(--brand),#7c3aed); display:grid; place-items:center; color:#fff; }
.topbar .brand-mark svg{ width:14px; height:14px; }
.topbar .title-crumb{ color:var(--text-secondary); font-size:13px; padding-left:var(--s3); border-left:1px solid var(--border); height:20px; line-height:20px; }
.topbar .spacer{ flex:1; }
.topbar .cmd-btn{
  display:flex; align-items:center; gap:var(--s2); height:28px; padding:0 var(--s3);
  background:var(--bg-inset); border:1px solid var(--border); border-radius:var(--r-sm);
  color:var(--text-muted); cursor:pointer; font-size:12.5px;
}
.topbar .cmd-btn:hover{ border-color:var(--border-strong); color:var(--text-secondary); }
.topbar .cmd-btn kbd{ font-family:var(--font-mono); font-size:10.5px; padding:1px 5px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:4px; }
.icon-btn{
  width:32px; height:32px; display:grid; place-items:center; background:transparent;
  border:none; border-radius:var(--r-sm); color:var(--text-secondary); cursor:pointer;
}
.icon-btn:hover{ background:var(--bg-hover); color:var(--brand); }
.icon-btn svg{ width:16px; height:16px; }

.layout{ display:flex; flex:1; min-height:0; }

/* Sidebar */
.sidebar{
  width:var(--sidebar-w); background:var(--bg-elevated); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:var(--s3) var(--s2); flex-shrink:0; overflow:hidden;
  transition:width 200ms cubic-bezier(.4,0,.2,1);
}
.sidebar.collapsed{ width:var(--sidebar-w-collapsed); }
.side-group{ margin-bottom:var(--s4); }
.side-label{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; padding:var(--s2) var(--s3); font-weight:600; }
.sidebar.collapsed .side-label{ opacity:0; }
.side-item{
  display:flex; align-items:center; gap:var(--s3); padding:0 var(--s3); height:34px; border-radius:var(--r-sm);
  color:var(--text-secondary); cursor:pointer; font-size:13px; margin-bottom:2px; white-space:nowrap; overflow:hidden;
}
.side-item:hover{ background:var(--bg-hover); color:var(--brand); }
.side-item.active{ background:var(--brand-soft); color:var(--brand); font-weight:500; }
html[data-theme="dark"] .side-item.active{ background:rgba(59,130,246,.15); }
.side-item svg{ width:16px; height:16px; flex-shrink:0; }
.sidebar.collapsed .side-item{ justify-content:center; padding:0; }
.sidebar.collapsed .side-item .side-text{ display:none; }
.side-bottom{ margin-top:auto; }

/* Main */
.main{ flex:1; overflow-y:auto; min-width:0; }
.page{ padding:var(--s6) var(--s7); max-width:1440px; margin:0 auto; }
.page-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--s5); gap:var(--s4); flex-wrap:wrap; }
.page-title{ font-size:20px; font-weight:600; letter-spacing:-.01em; }
.page-sub{ color:var(--text-secondary); font-size:13px; margin-top:2px; }

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn{
  display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 var(--s3);
  border-radius:var(--r-sm); font-size:12.5px; font-weight:500; border:1px solid transparent;
  cursor:pointer; transition:all 120ms; white-space:nowrap; user-select:none;
}
.btn svg{ width:14px; height:14px; }
.btn.md{ height:36px; padding:0 var(--s4); font-size:13px; }
.btn.sm{ height:26px; padding:0 var(--s2); font-size:12px; }
.btn.primary{ background:var(--brand); color:#fff; }
.btn.primary:hover{ background:var(--brand-hover); }
.btn.secondary{ background:var(--bg-elevated); color:var(--text-primary); border-color:var(--border-strong); }
.btn.secondary:hover{ background:var(--bg-hover); border-color:var(--brand); color:var(--brand); }
.btn.ghost{ background:transparent; color:var(--brand); }
.btn.ghost:hover{ background:var(--brand-soft); }
.btn.danger{ background:var(--danger); color:#fff; }
.btn.danger:hover{ background:#b91c1c; }
.btn.danger-ghost{ background:transparent; color:var(--danger); border-color:var(--danger); }
.btn.danger-ghost:hover{ background:var(--danger-soft); }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn.loading::before{ content:""; width:12px; height:12px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ==========================================================================
   Form controls
   ========================================================================== */
.field{ margin-bottom:var(--s4); }
.field-label{ display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:6px; font-weight:500; }
.field-label .req{ color:var(--danger); margin-left:2px; }
.field-hint{ font-size:11.5px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
.input,.select,.textarea{
  width:100%; height:32px; padding:0 var(--s3); font-size:13px; color:var(--text-primary);
  background:var(--bg-elevated); border:1px solid var(--border-strong); border-radius:var(--r-sm);
  outline:none; transition:border-color 120ms, box-shadow 120ms;
}
.textarea{ height:auto; min-height:80px; padding:8px var(--s3); font-family:var(--font-mono); font-size:12px; line-height:1.5; resize:vertical; }
.input:focus,.select:focus,.textarea:focus{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
.input.err{ border-color:var(--danger); }
.field-error{ font-size:11.5px; color:var(--danger); margin-top:4px; }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s4); }
.row-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--s4); }
.row-wide{ display:grid; grid-template-columns:2fr 1fr; gap:var(--s4); }

/* Toggle */
.switch{ position:relative; width:36px; height:20px; background:var(--border-strong); border-radius:var(--r-pill); cursor:pointer; transition:background 150ms; flex-shrink:0; }
.switch::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; background:#fff; border-radius:50%; transition:transform 150ms; }
.switch.on{ background:var(--brand); }
.switch.on::after{ transform:translateX(16px); }

/* Segmented */
.seg{ display:inline-flex; background:var(--bg-inset); border:1px solid var(--border); border-radius:var(--r-sm); padding:2px; gap:2px; }
.seg button{ height:24px; padding:0 var(--s3); background:transparent; border:none; border-radius:4px; font-size:12px; color:var(--text-secondary); cursor:pointer; }
.seg button.on{ background:var(--bg-elevated); color:var(--text-primary); box-shadow:0 1px 2px rgba(0,0,0,.05); font-weight:500; }
.seg button:not(.on):hover{ color:var(--text-primary); }

/* ==========================================================================
   Cards
   ========================================================================== */
.card{ background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s5); box-shadow:var(--sh-card); }
.card.tight{ padding:var(--s4); }
.card + .card{ margin-top:var(--s5); }
.card-header{ display:flex; align-items:center; justify-content:space-between; gap:var(--s3); margin-bottom:var(--s4); }
.card-header h3{ margin:0; font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px; }
.card-header .actions{ display:flex; gap:var(--s2); align-items:center; }
.card-desc{ color:var(--text-secondary); font-size:12.5px; margin:-1 * var(--s2) 0 var(--s4); line-height:1.6; }

/* ==========================================================================
   Badges / Chips / Tags
   ========================================================================== */
.badge{ display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 var(--s2); border-radius:var(--r-pill); font-size:11px; font-weight:500; white-space:nowrap; }
.badge.ok{ background:var(--success-soft); color:var(--success); }
.badge.no{ background:var(--danger-soft); color:var(--danger); }
.badge.warn{ background:var(--warning-soft); color:var(--warning); }
.badge.info{ background:var(--info-soft); color:var(--info); }
.badge.neutral{ background:var(--bg-inset); color:var(--text-secondary); }
.badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
.chip{ display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 var(--s2); background:var(--bg-inset); color:var(--text-secondary); border-radius:var(--r-sm); font-size:11.5px; }
.chip .x{ cursor:pointer; color:var(--text-muted); }
.chip .x:hover{ color:var(--danger); }
.chip-add{ display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 var(--s2); background:transparent; border:1px dashed var(--border-strong); color:var(--text-muted); border-radius:var(--r-sm); font-size:11.5px; cursor:pointer; }
.chip-add:hover{ border-color:var(--brand); color:var(--brand); }

/* ==========================================================================
   Instance card
   ========================================================================== */
.inst-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:var(--s4); }
.inst-card{
  position:relative; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--r-md);
  padding:var(--s4); cursor:pointer; transition:all 150ms;
}
.inst-card:hover{ border-color:var(--brand); box-shadow:var(--sh-pop); transform:translateY(-1px); }
.inst-card .head{ display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2); }
.db-icon{ width:20px; height:20px; display:grid; place-items:center; border-radius:5px; font-size:11px; font-weight:700; color:#fff; }
.db-icon.oracle{ background:#c74634; }
.db-icon.mysql{ background:#00758f; }
.inst-card .env{ font-weight:600; font-size:14px; }
.inst-card .alias{ color:var(--text-muted); font-size:11.5px; }
.inst-card .meta{ color:var(--text-secondary); font-size:12px; font-family:var(--font-mono); margin:6px 0 var(--s3); word-break:break-all; }
.inst-card .badges{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:var(--s3); }
.inst-card .quick{ display:flex; gap:var(--s2); padding-top:var(--s2); border-top:1px solid var(--border); }
.inst-card .kebab{ position:absolute; top:12px; right:12px; opacity:0; transition:opacity 150ms; }
.inst-card:hover .kebab{ opacity:1; }

/* ==========================================================================
   Table
   ========================================================================== */
.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th{ text-align:left; font-weight:500; color:var(--text-secondary); padding:8px 12px; border-bottom:1px solid var(--border); font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; }
.tbl td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
.tbl tr:last-child td{ border-bottom:none; }
.tbl tbody tr:hover{ background:var(--bg-hover); }
.tbl tr.clickable{ cursor:pointer; }
.tbl .num{ font-family:var(--font-mono); font-size:12px; color:var(--text-secondary); }

/* ==========================================================================
   Metrics (overview)
   ========================================================================== */
.metrics{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--s4); margin-bottom:var(--s5); }
.metric{ background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s4) var(--s5); }
.metric .label{ color:var(--text-secondary); font-size:12px; }
.metric .value{ font-size:26px; font-weight:600; margin-top:2px; letter-spacing:-.02em; }
.metric.tone-brand .value{ color:var(--brand); }
.metric.tone-warn .value{ color:var(--warning); }
.metric.tone-danger .value{ color:var(--danger); }
.metric.tone-success .value{ color:var(--success); }

/* ==========================================================================
   Stepper
   ========================================================================== */
.stepper{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s6); }
.step{ display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3); border-radius:var(--r-pill); color:var(--text-muted); font-size:12.5px; }
.step .num{ width:22px; height:22px; border-radius:50%; background:var(--bg-inset); color:var(--text-muted); display:grid; place-items:center; font-size:11px; font-weight:600; }
.step.done{ color:var(--success); }
.step.done .num{ background:var(--success-soft); color:var(--success); }
.step.current{ color:var(--brand); font-weight:500; }
.step.current .num{ background:var(--brand); color:#fff; }
.step-line{ flex:0 0 24px; height:1px; background:var(--border-strong); }

/* ==========================================================================
   Filter bar
   ========================================================================== */
.filter-bar{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s4); flex-wrap:wrap; }
.search{ position:relative; }
.search .input{ padding-left:32px; }
.search svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--text-muted); pointer-events:none; }

/* ==========================================================================
   Empty state
   ========================================================================== */
.empty{ padding:var(--s7); text-align:center; color:var(--text-secondary); }
.empty svg{ width:48px; height:48px; color:var(--text-muted); opacity:.4; margin-bottom:var(--s3); }
.empty h3{ margin:0 0 var(--s2); color:var(--text-primary); font-size:15px; }
.empty p{ margin:0 0 var(--s4); font-size:13px; }

/* ==========================================================================
   Slide-over
   ========================================================================== */
.overlay{ position:fixed; inset:0; background:rgba(15,23,42,.35); z-index:80; opacity:0; pointer-events:none; transition:opacity 220ms; }
.overlay.on{ opacity:1; pointer-events:auto; }
.slideover{
  position:fixed; top:0; right:0; bottom:0; width:560px; max-width:92vw; background:var(--bg-elevated);
  box-shadow:var(--sh-pop); z-index:90; transform:translateX(100%); transition:transform 220ms cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
.slideover.on{ transform:translateX(0); }
.so-header{ padding:var(--s4) var(--s5); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.so-title{ display:flex; align-items:center; gap:var(--s2); font-size:14px; font-weight:600; }
.so-close{ width:28px; height:28px; border-radius:var(--r-sm); background:transparent; border:none; cursor:pointer; color:var(--text-muted); display:grid; place-items:center; }
.so-close:hover{ background:var(--bg-hover); color:var(--text-primary); }
.so-tabs{ display:flex; padding:0 var(--s5); border-bottom:1px solid var(--border); gap:var(--s5); }
.so-tab{ padding:var(--s3) 0; font-size:12.5px; color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
.so-tab.on{ color:var(--brand); border-bottom-color:var(--brand); font-weight:500; }
.so-body{ flex:1; overflow-y:auto; padding:var(--s5); }
.so-footer{ padding:var(--s4) var(--s5); border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:var(--s2); }

/* ==========================================================================
   Modal
   ========================================================================== */
.modal{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.96); background:var(--bg-elevated); border-radius:var(--r-lg); box-shadow:var(--sh-pop); z-index:100; max-width:640px; width:92vw; max-height:85vh; display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:all 180ms; }
.modal.on{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
.modal-header{ padding:var(--s4) var(--s5); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-body{ padding:var(--s5); overflow-y:auto; flex:1; }
.modal-footer{ padding:var(--s4) var(--s5); border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:var(--s2); }
.modal.danger .modal-header h3{ color:var(--danger); }

/* ==========================================================================
   Command palette
   ========================================================================== */
.cmd{
  position:fixed; top:15vh; left:50%; transform:translateX(-50%); width:640px; max-width:92vw;
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--sh-pop);
  z-index:110; display:none; flex-direction:column; overflow:hidden;
}
.cmd.on{ display:flex; }
.cmd input{ height:44px; border:none; border-bottom:1px solid var(--border); padding:0 var(--s5); font-size:14px; outline:none; background:transparent; color:var(--text-primary); }
.cmd .results{ max-height:60vh; overflow-y:auto; padding:var(--s2); }
.cmd .group-label{ padding:var(--s2) var(--s3); font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; font-weight:600; }
.cmd .item{ display:flex; align-items:center; gap:var(--s3); padding:var(--s2) var(--s3); border-radius:var(--r-sm); cursor:pointer; font-size:13px; color:var(--text-primary); }
.cmd .item.on{ background:var(--brand-soft); color:var(--brand); }
html[data-theme="dark"] .cmd .item.on{ background:rgba(59,130,246,.18); color:var(--brand); }
.cmd .item svg{ width:14px; height:14px; color:var(--text-secondary); }
.cmd .item .shortcut{ margin-left:auto; color:var(--text-muted); font-family:var(--font-mono); font-size:10.5px; }
.cmd .hint-bar{ padding:var(--s2) var(--s5); border-top:1px solid var(--border); color:var(--text-muted); font-size:11px; display:flex; gap:var(--s4); }
.cmd .hint-bar kbd{ font-family:var(--font-mono); padding:1px 4px; background:var(--bg-inset); border-radius:3px; }

/* ==========================================================================
   Toast
   ========================================================================== */
.toasts{ position:fixed; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:360px; }
.toast{ background:var(--bg-elevated); color:var(--text-primary); border:1px solid var(--border); border-left:3px solid var(--success); padding:10px 14px; border-radius:var(--r-sm); box-shadow:var(--sh-pop); font-size:12.5px; animation:slide-in .2s; display:flex; align-items:center; gap:8px; }
.toast.err{ border-left-color:var(--danger); }
.toast.warn{ border-left-color:var(--warning); }
.toast.info{ border-left-color:var(--info); }
@keyframes slide-in{ from{ opacity:0; transform:translateX(12px); } to{ opacity:1; transform:translateX(0); } }

/* ==========================================================================
   Adapters picker
   ========================================================================== */
.db-picker{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:var(--s4); }
.db-pick{
  position:relative; padding:var(--s5); border:2px solid var(--border); border-radius:var(--r-md);
  background:var(--bg-elevated); cursor:pointer; transition:all 150ms;
}
.db-pick:hover{ border-color:var(--border-strong); }
.db-pick.on{ border-color:var(--brand); background:var(--brand-soft); }
html[data-theme="dark"] .db-pick.on{ background:rgba(59,130,246,.1); }
.db-pick .head{ display:flex; align-items:center; gap:var(--s3); margin-bottom:var(--s2); }
.db-pick .name{ font-weight:600; font-size:15px; }
.db-pick .meta{ color:var(--text-secondary); font-size:12px; font-family:var(--font-mono); }
.db-pick .tools{ color:var(--text-muted); font-size:11.5px; margin-top:var(--s2); }

/* ==========================================================================
   Tool checklist
   ========================================================================== */
.tools-group{ margin-bottom:var(--s3); }
.tools-group h4{ margin:0 0 var(--s2); font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
.tool{ display:flex; align-items:center; gap:var(--s2); padding:8px var(--s3); border:1px solid var(--border); border-radius:var(--r-sm); margin-bottom:6px; cursor:pointer; font-size:12.5px; }
.tool:hover{ background:var(--bg-hover); }
.tool input{ margin:0; }
.tool.locked{ background:var(--bg-inset); cursor:not-allowed; opacity:.7; }
.tool .tag{ margin-left:auto; font-size:10.5px; padding:1px 6px; border-radius:3px; }
.tool .tag.req{ background:var(--info-soft); color:var(--info); }
.tool .tag.danger{ background:var(--warning-soft); color:var(--warning); }

/* ==========================================================================
   KV list
   ========================================================================== */
.kv{ display:grid; grid-template-columns:120px 1fr auto; gap:8px var(--s3); font-size:12.5px; align-items:center; }
.kv dt{ color:var(--text-secondary); font-weight:500; }
.kv dd{ margin:0; font-family:var(--font-mono); font-size:12px; color:var(--text-primary); word-break:break-all; }
.kv .copy-btn{ opacity:0; transition:opacity 120ms; }
.kv:hover .copy-btn{ opacity:1; }

/* ==========================================================================
   Setup banner (post-onboarding)
   ========================================================================== */
.banner{ display:flex; align-items:center; gap:var(--s3); padding:var(--s3) var(--s5); background:linear-gradient(90deg,var(--brand-soft),transparent); border-left:3px solid var(--brand); border-radius:var(--r-sm); margin-bottom:var(--s5); font-size:13px; }
.banner .dismiss{ margin-left:auto; color:var(--text-muted); cursor:pointer; font-size:11px; }
.banner .dismiss:hover{ color:var(--text-primary); }

/* ==========================================================================
   Utility
   ========================================================================== */
.mono{ font-family:var(--font-mono); }
.text-sec{ color:var(--text-secondary); }
.text-mut{ color:var(--text-muted); }
.fw-600{ font-weight:600; }
.mt-4{ margin-top:16px; }
.mt-6{ margin-top:24px; }
.hidden{ display:none !important; }
.stack-2 > * + *{ margin-top:8px; }
.stack-3 > * + *{ margin-top:12px; }
.stack-4 > * + *{ margin-top:16px; }
.flex{ display:flex; }
.flex-col{ flex-direction:column; }
.items-center{ align-items:center; }
.justify-between{ justify-content:space-between; }
.gap-2{ gap:8px; }
.gap-3{ gap:12px; }
.gap-4{ gap:16px; }

/* Scrollbars */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:10px; border:2px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-thumb:hover{ background:var(--text-muted); background-clip:padding-box; border:2px solid transparent; }

/* Preview helper — dev-only, remove when integrated */
.env-pill{ position:fixed; bottom:12px; right:12px; z-index:1000; font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); background:var(--bg-elevated); border:1px solid var(--border); padding:2px 8px; border-radius:var(--r-pill); }

/* Setup wizard two-col layout */
.wizard-split{ display:grid; grid-template-columns:1fr 320px; gap:var(--s5); align-items:start; }
@media (max-width: 1200px){ .wizard-split{ grid-template-columns:1fr; } }
.wizard-side{ background:var(--bg-inset); border-radius:var(--r-md); padding:var(--s4); font-size:12px; color:var(--text-secondary); }
.wizard-side h4{ margin:0 0 var(--s2); font-size:12px; color:var(--text-primary); }
.wizard-side ul{ margin:0; padding-left:var(--s4); line-height:1.8; }

/* Skill target list */
.tgt-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:var(--s3); }
.tgt{ display:flex; align-items:center; gap:var(--s3); padding:10px var(--s3); background:var(--bg-inset); border-radius:var(--r-sm); font-size:12.5px; }
.tgt .path{ flex:1; font-family:var(--font-mono); color:var(--text-secondary); word-break:break-all; }

/* Log entry */
.log-row{ display:grid; grid-template-columns:130px 100px 60px 60px 1fr; gap:var(--s3); padding:6px var(--s3); font-family:var(--font-mono); font-size:11.5px; border-bottom:1px solid var(--border); align-items:center; }
.log-row:hover{ background:var(--bg-hover); }
.log-row .st-ok{ color:var(--success); }
.log-row .st-err{ color:var(--danger); }
.log-row .dur{ text-align:right; }
/* SVG sizing safety net: any inline SVG without width attribute defaults to 16px */
.icon-btn svg, .cmd-btn svg, .brand-mark svg, .side-item svg, .btn svg, .chip svg, .badge svg, .title-crumb svg { width:16px; height:16px; flex-shrink:0; }

}
function getAdapter(id){ return STATE.adapters.find(a=>a.id===id); }
function allInstances(){
  const out = [];
  for (const [code, info] of Object.entries(STATE.detect.state.envs)) out.push({ code, ...info });
  return out;
}
function filteredInstances(){
  const f = STATE.ui.filter;
  return allInstances().filter(i => {
    if (f.dbType !== "all" && i.dbType !== f.dbType) return false;
    const isWrite = i.tools.some(t => /(write|insert|update|delete)/i.test(t));
    if (f.perm === "ro" && isWrite) return false;
    if (f.perm === "rw" && !isWrite) return false;
    const isReg = STATE.detect.registeredServers.includes(getAdapter(i.dbType).serverPrefix + i.code);
    if (f.status === "reg" && !isReg) return false;
    if (f.status === "unreg" && isReg) return false;
    if (f.status === "err" && !(i.lastTest && !i.lastTest.ok)) return false;
    if (f.q){
      const hay = [i.code, ...(i.aliases||[]), i.host, i.user, i.database].join(" ").toLowerCase();
      if (!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  });
}
function isReg(i){ return STATE.detect.registeredServers.includes(getAdapter(i.dbType).serverPrefix + i.code); }
function hasWrite(i){ return i.tools.some(t => /(write|insert|update|delete)/i.test(t)); }

function bindSetup(step, d){
  if (step === 1){
    $$(".db-pick").forEach(el => el.onclick = () => {
      d.dbId = el.dataset.db;
      d.tools = getAdapter(d.dbId).requiredTools.slice();
      routes.setup(["1"]);
    });
    const n = $("#s1-next"); if (n) n.onclick = () => { toast("运行时部署完成", "ok"); location.hash = "#/setup/2"; };
  } else if (step === 2){
    const env = $("#s2-env"); if (env) env.oninput = e => { d.env = e.target.value; $("#s2-env").nextElementSibling; };
    const al = $("#s2-alias"); if (al) al.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); const v = e.target.value.trim(); if (v && !d.aliases.includes(v)) d.aliases.push(v); e.target.value=""; routes.setup(["2"]); } };
    $$("[data-preset]").forEach(el => el.onclick = () => {
      const a = getAdapter(d.dbId);
      const isWrite = t => /(write|insert|update|delete)/i.test(t);
      d.tools = el.dataset.preset === "ro" ? a.allTools.filter(t=>!isWrite(t)) : a.allTools.slice();
      routes.setup(["2"]);
    });
    $$("[data-tool]").forEach(el => el.onchange = () => {
      const t = el.dataset.tool;
      if (el.checked) { if (!d.tools.includes(t)) d.tools.push(t); }
      else d.tools = d.tools.filter(x => x !== t);
    });
    const n = $("#s2-next"); if (n) n.onclick = () => { n.classList.add("loading"); n.textContent="自检中…"; setTimeout(() => { toast("自检通过 · OK 12.2.0.1", "ok"); location.hash = "#/setup/3"; }, 1000); };
  } else if (step === 3){
    const done = $("#s3-done"); if (done) done.onclick = () => { STATE.setupCompleted = true; toast("全部完成！重启 QoderWork 让连接器生效", "ok"); location.hash = "#/instances"; };
  }
}

          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap">
            <div>
              <div class="fw-600">一键卸载</div>
              <div class="text-mut" style="font-size:12px">同「一键清空」，并移除安装程序与桌面快捷方式</div>
            </div>
            <div class="flex gap-2">
              <button class="btn secondary" onclick="openPreviewModal('uninstall')">${IC.info} 预览影响</button>
              <button class="btn danger" onclick="openDangerConfirm('uninstall')">执行</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><h3>关于</h3></div>
        <dl class="kv">
          <dt>版本</dt><dd class="mono">v0.3.0-redesign · <span class="text-mut">prototype</span></dd><span></span>
          <dt>构建</dt><dd class="mono">be976a8 · 2026-08-29</dd><span></span>
          <dt>许可</dt><dd>Apache-2.0</dd><span></span>
        </dl>
        <div class="mt-4 flex gap-2">
          <button class="btn ghost">检查更新</button>
          <button class="btn ghost">反馈问题</button>
          <button class="btn ghost">开源仓库</button>
        </div>
      </div>
    </div>
  `;
};

/* ==========================================================================
   Danger confirm flow (keyword input)
   ========================================================================== */
function openPreviewModal(kind){
  const title = kind === 'reset' ? '一键清空 · 影响预览' : '一键卸载 · 影响预览';
  const lines = [
    ['将删除的 mcp.json 条目', STATE.detect.registeredServers.length + ' 项'],
    ['将删除的 Skill 副本', STATE.detect.state.skillTargets.length + ' 个目录'],
    ['将删除的实例配置', Object.keys(STATE.detect.state.envs).length + ' 个实例'],
    ['将移入回收站的根目录', STATE.detect.root],
    ['将保留', kind === 'reset' ? '安装程序本身' : '无（本程序将退出）']
  ];
  $("#modal").innerHTML = `
    <div class="modal-header"><h3 style="margin:0">${IC.info} ${title}</h3><button class="so-close" onclick="closeModal()">${IC.x}</button></div>
    <div class="modal-body">
      <dl class="kv">
        ${lines.map(l => `<dt>${l[0]}</dt><dd>${esc(l[1])}</dd><span></span>`).join("")}
      </dl>
    </div>
    <div class="modal-footer"><button class="btn secondary" onclick="closeModal()">知道了</button></div>
  `;
  $("#modal").classList.add("on");
  $("#overlay").classList.add("on");
}
function openDangerConfirm(kind){
  const keyword = kind === 'reset' ? 'RESET' : 'UNINSTALL';
  $("#modal").innerHTML = `
    <div class="modal danger">
      <div class="modal-header"><h3 style="margin:0">${IC.alert} 确认${kind === 'reset' ? '清空' : '卸载'}</h3><button class="so-close" onclick="closeModal()">${IC.x}</button></div>
      <div class="modal-body">
        <p style="margin-top:0">此操作不可撤销，请先<「预览影响」确认所有将被删除的资源。</p>
        <div class="field">
          <div class="field-label">输入 <span class="mono fw-600">${keyword}</span> 以确认</div>
          <input class="input" id="danger-input" placeholder="${keyword}" autocomplete="off">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn secondary" onclick="closeModal()">取消</button>
        <button class="btn danger" id="danger-ok" disabled>确认执行</button>
      </div>
    </div>
  `;
  $("#modal").classList.add("on");
  $("#overlay").classList.add("on");
  const inp = $("#danger-input"), ok = $("#danger-ok");
  inp.oninput = () => ok.disabled = inp.value.trim() !== keyword;
  ok.onclick = () => { closeModal(); toast(`已${kind === 'reset' ? '清空' : '卸载'}`, 'ok'); };
}

/* ==========================================================================
   Command palette (⌘K)
   ========================================================================== */
const CMDS = [
  { group:"跳转", label:"总览", hint:"g o", run:()=>location.hash="#/overview" },
  { group:"跳转", label:"实例列表", hint:"g i", run:()=>location.hash="#/instances" },
  { group:"跳转", label:"Skill 与运行时", hint:"g r", run:()=>location.hash="#/runtime" },
  { group:"跳转", label:"排障", hint:"g d", run:()=>location.hash="#/diagnostics" },
  { group:"跳转", label:"系统", hint:"g s", run:()=>location.hash="#/system" },
  { group:"动作", label:"添加实例", hint:"⌘N", run:()=>openInstanceEditor() },
  { group:"动作", label:"一键自检全部", hint:"", run:()=>toast('全部自检已启动','info') },
  { group:"动作", label:"切换主题", hint:"", run:()=>$("#theme-toggle").click() },
];
function buildCmdList(){
  Object.entries(STATE.detect.state.envs).forEach(([code,i]) => CMDS.push({ group:"跳转", label:`实例 · ${i.dbType}/${code}`, hint:"", run:()=>openSlideOver(i.dbType, code) }));
}
buildCmdList();

let cmdOpen = false, cmdIdx = 0;
function openCmd(){ $("#cmd").classList.add("on"); $("#cmd-input").value=""; $("#cmd-input").focus(); cmdOpen=true; cmdIdx=0; renderCmd(""); }
function closeCmd(){ $("#cmd").classList.remove("on"); cmdOpen=false; }
function renderCmd(q){
  const items = CMDS.filter(c => !q || c.label.toLowerCase().includes(q.toLowerCase()));
  const groups = {};
  items.forEach((c,i) => { (groups[c.group] = groups[c.group] || []).push({...c, idx:i}); });
  $("#cmd-results").innerHTML = Object.entries(groups).map(([g, list]) => `
    <div class="group-label">${g}</div>
    ${list.map(c => `<div class="item ${c.idx===cmdIdx?'on':''}" data-idx="${c.idx}">${IC.right}<span>${esc(c.label)}</span><span class="shortcut">${c.hint}</span></div>`).join("")}
  `).join("") || `<div class="empty" style="padding:32px"><p>无匹配结果</p></div>`;
  $$("#cmd-results .item").forEach(el => el.onclick = () => { CMDS[+el.dataset.idx].run(); closeCmd(); });
}
$("#cmd-open").onclick = openCmd;
$("#cmd-input").addEventListener("input", e => { cmdIdx=0; renderCmd(e.target.value); });
$("#cmd-input").addEventListener("keydown", e => {
  const items = $$("#cmd-results .item");
  if (e.key === "ArrowDown"){ cmdIdx = Math.min(cmdIdx+1, items.length-1); renderCmd($("#cmd-input").value); }
  else if (e.key === "ArrowUp"){ cmdIdx = Math.max(cmdIdx-1, 0); renderCmd($("#cmd-input").value); }
  else if (e.key === "Enter"){ items[cmdIdx]?.click(); }
  else if (e.key === "Escape"){ closeCmd(); }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openCmd(); }
  else if (e.key === "Escape"){ if (cmdOpen) closeCmd(); else { closeSlideOver(); closeModal(); } }
});

/* ==========================================================================
   Theme toggle
   ========================================================================== */
$("#theme-toggle").onclick = () => {
  const html = document.documentElement;
  const next = html.dataset.theme === "light" ? "dark" : "light";
  html.dataset.theme = next;
  $("#theme-icon").innerHTML = next === "dark"
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
};

/* ==========================================================================
   Sidebar collapse
   ========================================================================== */
$("#collapse-btn").onclick = () => $("#sidebar").classList.toggle("collapsed");

/* ==========================================================================
   Nav wiring
   ========================================================================== */
$$(".side-item[data-route]").forEach(el => el.onclick = () => location.hash = "#/" + el.dataset.route);
$("#nav-inst-count").textContent = Object.keys(STATE.detect.state.envs).length;

/* ==========================================================================
   Boot
   ========================================================================== */
if (!location.hash) location.hash = STATE.setupCompleted ? "#/instances" : "#/welcome";
render();
</script>
