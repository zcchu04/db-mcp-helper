name: Build & Release

on:
  push:
    branches: [main, v0.3]
    tags: ['v*']
  pull_request:
    branches: [main, v0.3]
  workflow_dispatch:
    inputs:
      toolkit_jar_url:
        description: 'URL to oracle-db-mcp-toolkit JAR (optional, falls back to local build/cache)'
        required: false
        default: ''
      mysql_toolkit_url:
        description: 'URL to MySQL toolkit archive (optional)'
        required: false
        default: ''

env:
  APP_NAME: DB MCP Helper
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.3.0-dev' }}

jobs:
  # ─── Build core Java modules (mcp-tap + setup-app) ───
  build-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build mcp-tap
        run: mvn package -DskipTests -q -pl mcp-tap

      - name: Build setup-app (slim — no embedded resources)
        run: mvn package -DskipTests -q -pl setup-app

      - name: Stage core JARs flat
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/core-jars" | Out-Null
          Copy-Item "setup-app/target/db-mcp-setup.jar" "dist/core-jars/"
          Copy-Item "mcp-tap/target/mcp-tap.jar" "dist/core-jars/"

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-jars
          path: dist/core-jars/
          retention-days: 7

  # ─── Build jlink JRE runtime (per-platform for desktop installers) ───
  build-runtime:
    strategy:
      matrix:
        include:
          - platform: win-x64
            runs-on: windows-latest
            shell: pwsh
          - platform: macos-x64
            runs-on: macos-latest
            shell: bash
          - platform: linux-x64
            runs-on: ubuntu-latest
            shell: bash
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download core JARs
        uses: actions/download-artifact@v4
        with:
          name: core-jars

      - name: jlink JRE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fatJar = "db-mcp-setup.jar"
          $mods = (cmd /c "jdeps --ignore-missing-deps --print-module-deps `"$fatJar`" 2>&1") | Where-Object { $_ -notmatch "^WARNING:" }
          $full = @(
            "java.base", "java.logging", "java.xml", "java.desktop",
            "java.instrument", "java.management", "java.naming", "java.net.http",
            "java.rmi", "java.sql", "jdk.net", "jdk.security.jgss",
            "jdk.httpserver"
          )
          $all = (($full + ($mods -split ",")) | Sort-Object -Unique | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }) -join ","
          & jlink --add-modules $all --output "dist/runtime" `
            --strip-debug --no-header-files --no-man-pages --compress 2
          if ($LASTEXITCODE -ne 0) { throw "jlink failed" }

      - name: jlink JRE (Unix)
        if: runner.os != 'Windows'
        run: |
          MODS=$(jdeps --ignore-missing-deps --print-module-deps db-mcp-setup.jar 2>/dev/null || true)
          FULL="java.base,java.logging,java.xml,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.rmi,java.sql,jdk.net,jdk.security.jgss,jdk.httpserver"
          ALL=$(echo "${FULL},${MODS}" | tr ',' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')
          jlink --add-modules "$ALL" --output dist/runtime \
            --strip-debug --no-header-files --no-man-pages --compress 2

      - name: Upload raw runtime dir (for desktop installer)
        uses: actions/upload-artifact@v4
        with:
          name: jre-runtime-${{ matrix.platform }}
          path: dist/runtime/
          retention-days: 3

  # ─── Package implementation zips ───
  build-impls:
    runs-on: windows-latest
    needs: build-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: oracle
            serverId: builtin-toolkit
            runtimeKind: JAVA_JAR
            entryFile: oracle-db-mcp-toolkit.jar
          - db: mysql
            serverId: builtin-toolkit
            runtimeKind: NODE_JS
            entryFile: mysql-mcp-server
          - db: doris
            serverId: builtin-toolkit
            runtimeKind: NODE_JS
            entryFile: mysql-mcp-server
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Oracle toolkit JAR
        if: matrix.db == 'oracle'
        shell: pwsh
        run: |
          $jar = $null
          $candidates = @(
            "oracle-mcp-src/src/oracle-db-mcp-java-toolkit/target/oracle-db-mcp-toolkit-1.0.0.jar",
            "$env:USERPROFILE/.qoderwork/mcp/oracle-db-mcp/oracle-db-mcp-toolkit-1.0.0.jar"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) { $jar = $c; break }
          }
          if (-not $jar) {
            Write-Host "[WARN] Oracle toolkit JAR not found; impl package will be skipped"
            "SKIP=true" | Out-File $env:GITHUB_ENV
            return
          }
          "TOOLKIT_SRC=$jar" | Out-File $env:GITHUB_ENV
          Write-Host "[OK] Using Oracle toolkit: $jar"

      - name: Resolve MySQL toolkit
        if: matrix.db == 'mysql' || matrix.db == 'doris'
        env:
          MYSQL_TOOLKIT_URL: ${{ inputs.mysql_toolkit_url }}
        shell: pwsh
        run: |
          $toolkit = $null
          $candidates = @(
            "mysql-mcp-src/target/mysql-mcp-server",
            "$env:USERPROFILE/.qoderwork/mcp/mysql-mcp-server"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) { $toolkit = $c; break }
          }
          if (-not $toolkit -and $env:MYSQL_TOOLKIT_URL) {
            Write-Host "[INFO] Downloading MySQL toolkit from $env:MYSQL_TOOLKIT_URL"
            New-Item -ItemType Directory -Force -Path "dist/mysql-dl" | Out-Null
            $dlFile = "dist/mysql-dl/mysql-toolkit.tar.gz"
            Invoke-WebRequest -Uri $env:MYSQL_TOOLKIT_URL -OutFile $dlFile -UseBasicParsing
            $dlDir = "dist/mysql-dl/extracted"
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
            tar -xzf $dlFile -C $dlDir
            $found = Get-ChildItem $dlDir -Directory -Recurse | Select-Object -First 1
            if ($found) { $toolkit = $found.FullName }
          }
          if (-not $toolkit) {
            Write-Host "[WARN] MySQL toolkit not found; ${{ matrix.db }} impl package will be skipped"
            "SKIP=true" | Out-File $env:GITHUB_ENV
            return
          }
          "TOOLKIT_SRC=$toolkit" | Out-File $env:GITHUB_ENV
          Write-Host "[OK] Using MySQL toolkit (${{ matrix.db }}): $toolkit"

      - name: Package impl zip
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          $version = "${{ env.APP_VERSION }}" -replace '^v',''
          $db = "${{ matrix.db }}"
          $serverId = "${{ matrix.serverId }}"
          $runtimeKind = "${{ matrix.runtimeKind }}"
          $entryFile = "${{ matrix.entryFile }}"
          $implDir = "dist/impl-$db-staging"
          $destDir = "$implDir/$serverId"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null

          if ($runtimeKind -eq "JAVA_JAR") {
            Copy-Item $env:TOOLKIT_SRC "$destDir/$entryFile"
          } else {
            Copy-Item -Recurse -Force "$env:TOOLKIT_SRC/*" $destDir
            $shimSrc = "setup-app/src/main/shims/mysql-build-index.js"
            $shimDest = "$destDir/build/index.js"
            if ((Test-Path "$destDir/build") -and (Test-Path $shimSrc)) {
              Copy-Item $shimSrc $shimDest -Force
              Write-Host "[OK] MySQL build/index.js shim overlaid"
            }
          }

          @{
            type = "impl-$db-toolkit"
            version = "1.0.0"
            helperVersion = $version
            platform = "any"
            runtimeKind = $runtimeKind
            dbId = $db
            serverId = $serverId
            entryFile = $entryFile
            createdAt = (Get-Date -Format "o")
          } | ConvertTo-Json | Set-Content "$implDir/manifest.json" -Encoding UTF8

          Compress-Archive -Path "$implDir/*" -DestinationPath "dist/db-mcp-impl-$db-$version.zip"
          Write-Host "[OK] $db impl package created"

      - name: Upload impl
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: impl-${{ matrix.db }}
          path: dist/db-mcp-impl-${{ matrix.db }}-*.zip
          retention-days: 30

  # ─── Desktop installers (Tauri) — 3 platforms × 3 variants ───
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runs-on: windows-latest
            shell: pwsh
            variant: slim
          - platform: win-x64
            runs-on: windows-latest
            shell: pwsh
            variant: standard
          - platform: win-x64
            runs-on: windows-latest
            shell: pwsh
            variant: full
          - platform: macos-x64
            runs-on: macos-latest
            shell: bash
            variant: slim
          - platform: macos-x64
            runs-on: macos-latest
            shell: bash
            variant: standard
          - platform: macos-x64
            runs-on: macos-latest
            shell: bash
            variant: full
          - platform: linux-x64
            runs-on: ubuntu-latest
            shell: bash
            variant: slim
          - platform: linux-x64
            runs-on: ubuntu-latest
            shell: bash
            variant: standard
          - platform: linux-x64
            runs-on: ubuntu-latest
            shell: bash
            variant: full
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    needs: [build-core, build-runtime, build-impls]
    env:
      CI_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.3.0-dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      # ── Linux: install Tauri system dependencies ──
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache /usr/local/.cache \
            /usr/share/swift /usr/local/share/chromium \
            /opt/google/chrome /opt/microsoft/msedge /usr/share/miniconda \
            /usr/local/aws-cli /usr/local/lib/heroku
          sudo apt-get purge -y --auto-remove \
            llvm-14 llvm-15 llvm-16 clang-14 clang-15 clang-16 \
            mono-* ghc-* cabal-install-* 2>/dev/null || true
          sudo apt-get clean
          sudo docker image prune -af 2>/dev/null || true
          sudo docker builder prune -af 2>/dev/null || true
          echo "=== Disk space AFTER cleanup ==="
          df -h .

      - name: Free disk space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Disk space BEFORE cleanup ==="
          Get-PSDrive C | ForEach-Object { Write-Host ("{0:N1} GB free / {1:N1} GB used" -f ($_.Free/1GB), ($_.Used/1GB)) }
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:USERPROFILE\.dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Python" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:USERPROFILE\AppData\Local\Android" -ErrorAction SilentlyContinue
          Write-Host "=== Disk space AFTER cleanup ==="
          Get-PSDrive C | ForEach-Object { Write-Host ("{0:N1} GB free / {1:N1} GB used" -f ($_.Free/1GB), ($_.Used/1GB)) }

      - name: Download core JARs
        uses: actions/download-artifact@v4
        with:
          name: core-jars

      - name: Download JRE runtime (full variant only)
        if: matrix.variant == 'full'
        uses: actions/download-artifact@v4
        with:
          name: jre-runtime-${{ matrix.platform }}
          path: dist/runtime

      - name: Download implementation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: impl-*
          path: dist/impls
          merge-multiple: true
          required: false

      - name: Inject CI version
        env:
          VER: ${{ env.CI_VERSION }}
        run: |
          node -e "const fs=require('fs'); const v=process.env.VER.replace(/^v/,''); const p='shell/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version=v; fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs'); const v=process.env.VER.replace(/^v/,''); const p='shell/src-tauri/tauri.conf.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version=v; fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          echo "Injected version: $(node -p "require('./shell/package.json').version")"

      # ── Stage Tauri bundle (Windows) ──
      - name: Stage Tauri bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "shell/bundle"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          # Core JARs (all variants)
          Copy-Item "db-mcp-setup.jar" "$bundle/db-mcp-setup.jar"
          New-Item -ItemType Directory -Force -Path "$bundle/tap" | Out-Null
          Copy-Item "mcp-tap.jar" "$bundle/tap/mcp-tap.jar"

          # JRE runtime (full variant only)
          if ("${{ matrix.variant }}" -eq "full" -and (Test-Path "dist/runtime")) {
            Copy-Item "dist/runtime" "$bundle/runtime" -Recurse -Force
            Write-Host "[OK] Bundled JRE staged (full variant)"
          } else {
            Write-Host "[OK] ${{ matrix.variant }} variant — no JRE bundled"
          }

          # Implementation artifacts (standard: oracle+mysql; full: all)
          $variant = "${{ matrix.variant }}"
          if ($variant -ne "slim") {
            $implZips = Get-ChildItem "dist/impls" -Filter "*.zip" -ErrorAction SilentlyContinue
            if ($implZips) {
              foreach ($z in $implZips) {
                $db = ""
                if ($z.Name -match "impl-(oracle|mysql|doris)") { $db = $Matches[1] }
                if ($variant -eq "standard" -and $db -eq "doris") {
                  Write-Host "[SKIP] doris impl (standard variant)"
                  continue
                }
                $tmp = "dist/tmp-extract-$($z.BaseName)"
                Expand-Archive -Path $z.FullName -DestinationPath $tmp -Force
                $destDir = "$bundle/impls"
                New-Item -ItemType Directory -Force -Path $destDir | Out-Null
                $srcContent = Get-ChildItem $tmp | Where-Object { $_.Name -ne "manifest.json" }
                foreach ($item in $srcContent) {
                  Copy-Item $item.FullName $destDir -Recurse -Force
                }
                Remove-Item $tmp -Recurse -Force
                Write-Host "[OK] $db impl staged ($variant variant)"
              }
            } else {
              Write-Host "[WARN] No impl zips found in dist/impls/"
            }
          } else {
            Write-Host "[OK] Slim variant — no impls bundled"
          }

      # ── Stage Tauri bundle (Unix) ──
      - name: Stage Tauri bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p shell/bundle/tap

          # Core JARs (all variants)
          cp db-mcp-setup.jar shell/bundle/
          cp mcp-tap.jar shell/bundle/tap/

          # JRE runtime (full variant only)
          if [ "${{ matrix.variant }}" = "full" ] && [ -d "dist/runtime" ]; then
            cp -r dist/runtime shell/bundle/runtime
            echo "[OK] Bundled JRE staged (full variant)"
          else
            echo "[OK] ${{ matrix.variant }} variant — no JRE bundled"
          fi

          # Implementation artifacts (standard: oracle+mysql; full: all)
          variant="${{ matrix.variant }}"
          if [ "$variant" != "slim" ]; then
            mkdir -p shell/bundle/impls
            for z in dist/impls/*.zip; do
              [ -f "$z" ] || continue
              db=$(echo "$z" | grep -oE 'impl-(oracle|mysql|doris)' | head -1 | sed 's/impl-//')
              if [ "$variant" = "standard" ] && [ "$db" = "doris" ]; then
                echo "[SKIP] doris impl (standard variant)"
                continue
              fi
              tmp="dist/tmp-extract-$(basename "$z" .zip)"
              mkdir -p "$tmp"
              unzip -q -o "$z" -d "$tmp"
              rm -f "$tmp/manifest.json"
              cp -r "$tmp"/* shell/bundle/impls/ 2>/dev/null || true
              rm -rf "$tmp"
              echo "[OK] $db impl staged ($variant variant)"
            done
          else
            echo "[OK] Slim variant — no impls bundled"
          fi

      # ── Build Tauri installer (Windows) ──
      - name: Build Tauri installer (Windows)
        if: runner.os == 'Windows'
        working-directory: shell
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          Write-Host "=== Disk space before build ==="
          Get-PSDrive C | ForEach-Object { Write-Host ("{0:N1} GB free" -f ($_.Free/1GB)) }
          Write-Host "=== Bundle directory ==="
          Get-ChildItem bundle -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum | ForEach-Object { Write-Host ("{0:N0} MB" -f ($_.Sum / 1MB)) }
          if (Test-Path bundle/runtime) {
            Write-Host "=== JRE runtime size ==="
            Get-ChildItem bundle/runtime -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum | ForEach-Object { Write-Host ("{0:N0} MB" -f ($_.Sum / 1MB)) }
          }
          npm install
          $variant = "${{ matrix.variant }}"
          if ($variant -eq "full") {
            Write-Host "[INFO] Full variant — building NSIS only to save disk space"
            npx tauri build --bundles nsis
          } else {
            npx tauri build
          }
          Write-Host "=== Disk space after build ==="
          Get-PSDrive C | ForEach-Object { Write-Host ("{0:N1} GB free" -f ($_.Free/1GB)) }
          Write-Host "=== Build output ==="
          Get-ChildItem src-tauri/target/release/bundle -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length

      # ── Build Tauri installer (Unix) ──
      - name: Build Tauri installer (Unix)
        if: runner.os != 'Windows'
        working-directory: shell
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          echo "=== Disk space before build ==="
          df -h .
          echo "=== Bundle directory size ==="
          du -sh bundle/ 2>/dev/null || echo "(no bundle dir)"
          ls -la bundle/ 2>/dev/null || true
          if [ -d bundle/runtime ]; then
            echo "=== JRE runtime size ==="
            du -sh bundle/runtime/
            find bundle/runtime -type f | wc -l | xargs -I{} echo "  {} files"
          fi
          npm install

          BUNDLE_FLAG=""
          if [ "${{ runner.os }}" = "Linux" ] && [ "${{ matrix.variant }}" = "full" ]; then
            echo "[INFO] Linux full variant — building .deb only (skip AppImage to save disk)"
            BUNDLE_FLAG="--bundles deb"
          fi

          set +e
          npx tauri build $BUNDLE_FLAG 2>&1 | tee /tmp/tauri-build.log
          build_rc=${PIPESTATUS[0]}
          set -e
          if [ $build_rc -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED (exit $build_rc) — last 80 lines ==="
            tail -80 /tmp/tauri-build.log
            echo "=== Disk space after failed build ==="
            df -h .
            exit $build_rc
          fi
          echo "=== Disk space after build ==="
          df -h .
          echo "=== Build output ==="
          find src-tauri/target/release/bundle -type f 2>/dev/null || echo "(no bundle output)"

      # ── Rename installer to include variant and version ──
      - name: Rename installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ env.CI_VERSION }}" -replace '^v',''
          $variant = "${{ matrix.variant }}"
          $platform = "${{ matrix.platform }}"
          $bundleDir = "shell/src-tauri/target/release/bundle"

          Write-Host "=== Bundle directory contents ==="
          if (Test-Path $bundleDir) {
            Get-ChildItem $bundleDir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "[ERROR] Bundle directory not found: $bundleDir"
            exit 1
          }

          $installers = Get-ChildItem $bundleDir -Recurse -Include "*.exe","*.msi" -ErrorAction SilentlyContinue
          if (-not $installers -or $installers.Count -eq 0) {
            Write-Host "[ERROR] No .exe or .msi files found in $bundleDir"
            exit 1
          }

          $installers | ForEach-Object {
            $ext = $_.Extension
            $newName = "db-mcp-helper-$variant-$platform-$version$ext"
            Rename-Item $_.FullName $newName
            Write-Host "[OK] $($_.Name) -> $newName"
          }

      - name: Rename installer (Unix)
        if: runner.os != 'Windows'
        run: |
          version="${{ env.CI_VERSION }}"
          version="${version#v}"
          variant="${{ matrix.variant }}"
          platform="${{ matrix.platform }}"
          bundleDir="shell/src-tauri/target/release/bundle"

          find "$bundleDir" -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) | while read -r f; do
            ext="${f##*.}"
            newName="db-mcp-helper-${variant}-${platform}-${version}.${ext}"
            mv "$f" "$(dirname "$f")/$newName"
            echo "[OK] $(basename "$f") -> $newName"
          done

      # ── Upload installer artifacts ──
      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            shell/src-tauri/target/release/bundle/**/*.exe
            shell/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.variant }}
          path: shell/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installer (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            shell/src-tauri/target/release/bundle/**/*.deb
            shell/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 30

  # ─── GitHub Release (tags only) ───
  release:
    runs-on: ubuntu-latest
    needs: [desktop]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist/installers
          merge-multiple: true

      - name: Flatten installer layout
        run: |
          mkdir -p dist/upload
          find dist/installers -type f \( -name "*.exe" -o -name "*.msi" \
            -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) \
            -exec cp {} dist/upload/ \;
          echo "=== Release files ==="
          ls -la dist/upload/

      - name: Generate checksums.txt
        run: |
          cd dist/upload
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
