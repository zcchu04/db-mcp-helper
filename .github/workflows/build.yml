name: Build and Package

# 三平台产物均为 Tauri 桌面壳（内嵌 WebView 加载 Java 后端 http://127.0.0.1:8765）。
# Java 侧 jlink runtime + fat jar 被 stage 到 shell/bundle/，作为 Tauri resources 打进安装包。
# Windows: NSIS .exe；macOS: .dmg（未签名，用户需右键打开）；Linux: .deb + .AppImage。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            bundles: nsis
          - label: macOS
            os: macos-latest
            bundles: dmg
          - label: Linux
            os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      - name: Install Linux system deps (webkit2gtk 4.1 + tauri toolchain)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf

      # ---- 构建 Java 后端依赖：oracle-db-mcp-toolkit + mcp-tap ----
      - name: Checkout oracle/mcp (sparse)
        uses: actions/checkout@v4
        with:
          repository: oracle/mcp
          path: oracle-mcp-src
          sparse-checkout: src/oracle-db-mcp-java-toolkit

      - name: Build oracle-db-mcp-toolkit
        shell: bash
        run: |
          set -e
          cd oracle-mcp-src/src/oracle-db-mcp-java-toolkit
          mvn clean package -DskipTests -q
          ls -lh target/

      - name: Build mcp-tap
        shell: bash
        run: mvn package -DskipTests -q -pl mcp-tap

      # ---- jlink 统一运行时（Tauri resources 里的 bundle/runtime 兜底 JDK） ----
      # 模块集必须含 jdk.httpserver（SetupMain 用 com.sun.net.httpserver）。
      - name: jlink unified runtime
        shell: bash
        run: |
          set -e
          TOOLKIT=oracle-mcp-src/src/oracle-db-mcp-java-toolkit/target/oracle-db-mcp-toolkit-1.0.0.jar
          MODS=$(jdeps --ignore-missing-deps --print-module-deps "$TOOLKIT")
          FULL="java.base,java.logging,java.xml,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.rmi,java.sql,jdk.net,jdk.security.jgss,jdk.httpserver"
          ALL=$(printf "%s,%s" "$FULL" "$MODS" | tr ',' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "Modules: $ALL"
          rm -rf dist/runtime
          jlink --add-modules "$ALL" --output dist/runtime \
            --strip-debug --no-header-files --no-man-pages --compress 2
          du -sh dist/runtime

      # ---- 资源内嵌 + 构建 setup-app fat jar ----
      - name: Stage resources
        shell: bash
        run: |
          export TOOLKIT_SRC="$(pwd)/oracle-mcp-src/src/oracle-db-mcp-java-toolkit/target/oracle-db-mcp-toolkit-1.0.0.jar"
          chmod +x stage-resources.sh
          ./stage-resources.sh

      - name: Build setup-app (fat jar)
        shell: bash
        run: mvn package -DskipTests -q -pl setup-app

      # ---- Tauri 打包：stage bundle → npm install → 生成图标 → tauri build ----
      - name: Stage Tauri bundle (jar + jlink runtime)
        shell: bash
        run: |
          set -e
          rm -rf shell/bundle
          mkdir -p shell/bundle
          cp setup-app/target/db-mcp-setup.jar shell/bundle/db-mcp-setup.jar
          cp -r dist/runtime shell/bundle/runtime
          echo "--- shell/bundle layout ---"
          ls -lh shell/bundle/
          du -sh shell/bundle shell/bundle/runtime

      - name: Install shell npm deps
        working-directory: shell
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Generate Tauri icon set (all platforms)
        working-directory: shell
        shell: bash
        # 从唯一源图 icon.png 生成 32x32.png / 128x128.png / 128x128@2x.png / icon.icns / icon.ico
        # （Linux deb 需要 32x32+128x128；macOS dmg 需要 .icns；Windows NSIS 需要 .ico）
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Tauri build
        working-directory: shell
        shell: bash
        run: npx tauri build --bundles "${{ matrix.bundles }}"

      - name: List bundle output
        shell: bash
        run: find shell/src-tauri/target/release/bundle -maxdepth 3 -type f | sort

      - name: Upload Windows artifact (Tauri NSIS .exe)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DB-MCP-Helper-Windows
          path: shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload macOS artifact (Tauri DMG)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DB-MCP-Helper-macOS
          path: shell/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifacts (Tauri .deb + AppImage)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DB-MCP-Helper-Linux
          path: |
            shell/src-tauri/target/release/bundle/deb/*.deb
            shell/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # ---- 创建 Release（仅 tag 推送时触发） ----
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: DB MCP Helper ${{ github.ref_name }}
          body: |
            ## DB MCP Helper ${{ github.ref_name }}

            多数据库 MCP 可视化安装器（Oracle + MySQL）三平台安装包，Tauri 桌面壳内嵌 WebView 向导，不再弹系统浏览器。

            - **Windows**: `DB MCP Helper_*_x64-setup.exe`（Tauri NSIS）
            - **macOS**: `DB MCP Helper_*.dmg`（未签名，首次打开需右键 → 打开）
            - **Linux**: `db-mcp-helper_*.deb` / `DB MCP Helper_*.AppImage`

            ### 安装说明

            - **Windows**: 双击 `.exe`，向导可选安装目录；快捷方式启动 Tauri 壳
            - **macOS**: 拖入 Applications；未做 Developer ID 签名，首次需在 Finder 右键 → 打开
            - **Linux**: `sudo dpkg -i db-mcp-helper_*.deb`，或直接运行 `.AppImage`

            ### 首次使用

            1. 启动 Tauri 壳（自动 spawn Java 后端 `db-mcp-setup.jar --no-browser`）
            2. WebView 打开部署向导（http://127.0.0.1:8765）
            3. 添加数据库环境（支持粘贴 Spring 配置片段）→ 自检 → 注册到 AI 平台
          files: |
            release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
