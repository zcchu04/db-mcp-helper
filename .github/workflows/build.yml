name: Build & Release

on:
  push:
    branches: [main, v0.3]
    tags: ['v*']
  pull_request:
    branches: [main, v0.3]
  workflow_dispatch:
    inputs:
      toolkit_jar_url:
        description: 'URL to oracle-db-mcp-toolkit JAR (optional, falls back to local build/cache)'
        required: false
        default: ''
      mysql_toolkit_url:
        description: 'URL to MySQL toolkit archive (optional)'
        required: false
        default: ''

env:
  APP_NAME: DB MCP Helper
  APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.3.0-dev' }}

jobs:
  # ─── Build core Java modules (mcp-tap + setup-app) ───
  build-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build mcp-tap
        run: mvn package -DskipTests -q -pl mcp-tap

      - name: Build setup-app (slim — no embedded resources)
        run: mvn package -DskipTests -q -pl setup-app

      - name: Package slim zip
        shell: pwsh
        run: |
          $version = "${{ env.APP_VERSION }}" -replace '^v',''
          $slimDir = "dist/slim-staging"
          New-Item -ItemType Directory -Force -Path $slimDir | Out-Null

          Copy-Item "setup-app/target/db-mcp-setup.jar" "$slimDir/"
          New-Item -ItemType Directory -Force -Path "$slimDir/tap" | Out-Null
          Copy-Item "mcp-tap/target/mcp-tap.jar" "$slimDir/tap/"

          @{
            type = "slim"
            version = $version
            helperVersion = $version
            platform = "win-x64"
            createdAt = (Get-Date -Format "o")
          } | ConvertTo-Json | Set-Content "$slimDir/manifest.json" -Encoding UTF8

          Compress-Archive -Path "$slimDir/*" -DestinationPath "dist/db-mcp-helper-slim-win-x64-$version.zip"
          Write-Host "[OK] slim package created"

      - name: Stage core JARs flat
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/core-jars" | Out-Null
          Copy-Item "setup-app/target/db-mcp-setup.jar" "dist/core-jars/"
          Copy-Item "mcp-tap/target/mcp-tap.jar" "dist/core-jars/"

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-jars
          path: dist/core-jars/
          retention-days: 7

      - name: Upload slim package
        uses: actions/upload-artifact@v4
        with:
          name: slim-package
          path: dist/db-mcp-helper-slim-*.zip
          retention-days: 30

  # ─── Build jlink JRE runtime (per-platform for desktop installers) ───
  build-runtime:
    strategy:
      matrix:
        include:
          - platform: win-x64
            runs-on: windows-latest
            shell: pwsh
          - platform: macos-x64
            runs-on: macos-latest
            shell: bash
          - platform: linux-x64
            runs-on: ubuntu-latest
            shell: bash
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    needs: build-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download core JARs
        uses: actions/download-artifact@v4
        with:
          name: core-jars

      - name: jlink JRE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fatJar = "db-mcp-setup.jar"
          $mods = (cmd /c "jdeps --ignore-missing-deps --print-module-deps `"$fatJar`" 2>&1") | Where-Object { $_ -notmatch "^WARNING:" }
          $full = @(
            "java.base", "java.logging", "java.xml", "java.desktop",
            "java.instrument", "java.management", "java.naming", "java.net.http",
            "java.rmi", "java.sql", "jdk.net", "jdk.security.jgss",
            "jdk.httpserver"
          )
          $all = (($full + ($mods -split ",")) | Sort-Object -Unique | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }) -join ","
          & jlink --add-modules $all --output "dist/runtime" `
            --strip-debug --no-header-files --no-man-pages --compress 2
          if ($LASTEXITCODE -ne 0) { throw "jlink failed" }

      - name: jlink JRE (Unix)
        if: runner.os != 'Windows'
        run: |
          MODS=$(jdeps --ignore-missing-deps --print-module-deps db-mcp-setup.jar 2>/dev/null || true)
          FULL="java.base,java.logging,java.xml,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.rmi,java.sql,jdk.net,jdk.security.jgss,jdk.httpserver"
          ALL=$(echo "${FULL},${MODS}" | tr ',' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')
          jlink --add-modules "$ALL" --output dist/runtime \
            --strip-debug --no-header-files --no-man-pages --compress 2

      - name: Package JRE runtime zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ env.APP_VERSION }}" -replace '^v',''
          $rtDir = "dist/runtime-staging"
          New-Item -ItemType Directory -Force -Path $rtDir | Out-Null
          Copy-Item "dist/runtime" "$rtDir/runtime" -Recurse
          @{
            type = "runtime-jre"
            version = $version
            helperVersion = $version
            platform = "${{ matrix.platform }}"
            runtimeKind = "JAVA_JAR"
            createdAt = (Get-Date -Format "o")
          } | ConvertTo-Json | Set-Content "$rtDir/manifest.json" -Encoding UTF8
          Compress-Archive -Path "$rtDir/*" -DestinationPath "dist/db-mcp-runtime-jre-${{ matrix.platform }}-$version.zip"

      - name: Upload JRE runtime zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-jre-${{ matrix.platform }}
          path: dist/db-mcp-runtime-jre-*.zip
          retention-days: 30

      - name: Upload raw runtime dir (for desktop installer)
        uses: actions/upload-artifact@v4
        with:
          name: jre-runtime-${{ matrix.platform }}
          path: dist/runtime/
          retention-days: 3

  # ─── Package implementation zips ───
  build-impls:
    runs-on: windows-latest
    needs: build-core
    strategy:
      matrix:
        include:
          - db: oracle
            serverId: builtin-toolkit
            jarPattern: "oracle-db-mcp-toolkit-*.jar"
            runtimeKind: JAVA_JAR
            entryFile: oracle-db-mcp-toolkit.jar
    steps:
      - uses: actions/checkout@v4

      - name: Resolve toolkit JAR
        shell: pwsh
        run: |
          $jar = $null
          $candidates = @(
            "oracle-mcp-src/src/oracle-db-mcp-java-toolkit/target/oracle-db-mcp-toolkit-1.0.0.jar",
            "$env:USERPROFILE/.qoderwork/mcp/oracle-db-mcp/oracle-db-mcp-toolkit-1.0.0.jar"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) { $jar = $c; break }
          }
          if (-not $jar) {
            Write-Host "[WARN] Oracle toolkit JAR not found; impl package will be skipped"
            "SKIP=true" | Out-File $env:GITHUB_ENV
            return
          }
          "TOOLKIT_JAR=$jar" | Out-File $env:GITHUB_ENV
          Write-Host "[OK] Using toolkit: $jar"

      - name: Package Oracle impl zip
        if: env.SKIP != 'true'
        shell: pwsh
        run: |
          $version = "${{ env.APP_VERSION }}" -replace '^v',''
          $implDir = "dist/impl-oracle-staging"
          New-Item -ItemType Directory -Force -Path "$implDir/builtin-toolkit" | Out-Null
          Copy-Item $env:TOOLKIT_JAR "$implDir/builtin-toolkit/oracle-db-mcp-toolkit.jar"
          @{
            type = "impl-oracle-toolkit"
            version = "1.0.0"
            helperVersion = $version
            platform = "any"
            runtimeKind = "JAVA_JAR"
            dbId = "oracle"
            serverId = "builtin-toolkit"
            entryFile = "oracle-db-mcp-toolkit.jar"
            createdAt = (Get-Date -Format "o")
          } | ConvertTo-Json | Set-Content "$implDir/manifest.json" -Encoding UTF8
          Compress-Archive -Path "$implDir/*" -DestinationPath "dist/db-mcp-impl-oracle-toolkit-$version.zip"
          Write-Host "[OK] Oracle impl package created"

      - name: Upload Oracle impl
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: impl-oracle
          path: dist/db-mcp-impl-oracle-*.zip
          retention-days: 30

  # ─── Assemble full package (core + impls + runtimes) — Windows zip ───
  assemble:
    runs-on: windows-latest
    needs: [build-core, build-runtime, build-impls]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Assemble full package
        shell: pwsh
        run: |
          $version = "${{ env.APP_VERSION }}" -replace '^v',''
          $fullDir = "dist/full-staging"
          New-Item -ItemType Directory -Force -Path $fullDir | Out-Null

          # Core: setup-app jar + tap jar
          $coreDir = "dist/artifacts/core-jars"
          if (Test-Path $coreDir) {
            Copy-Item "$coreDir/db-mcp-setup.jar" $fullDir
            New-Item -ItemType Directory -Force -Path "$fullDir/tap" | Out-Null
            Copy-Item "$coreDir/mcp-tap.jar" "$fullDir/tap/"
          }

          # JRE runtime (Windows-specific from matrix)
          $rtDir = "dist/artifacts/jre-runtime-win-x64"
          if (Test-Path $rtDir) {
            New-Item -ItemType Directory -Force -Path "$fullDir/runtime" | Out-Null
            Copy-Item "$rtDir/*" "$fullDir/runtime/" -Recurse -Force
          }

          # Implementation: extract impl zips into impls/
          $implZips = Get-ChildItem "dist/artifacts" -Recurse -Filter "db-mcp-impl-*.zip"
          if ($implZips) {
            foreach ($z in $implZips) {
              $tmp = "dist/tmp-extract-$($z.BaseName)"
              Expand-Archive -Path $z.FullName -DestinationPath $tmp -Force
              $manifest = Get-Content "$tmp/manifest.json" -Raw | ConvertFrom-Json
              $dbId = $manifest.dbId
              $serverId = $manifest.serverId
              $destDir = "$fullDir/impls/$dbId/$serverId"
              New-Item -ItemType Directory -Force -Path $destDir | Out-Null
              $srcContent = Get-ChildItem $tmp | Where-Object { $_.Name -ne "manifest.json" }
              foreach ($item in $srcContent) {
                Copy-Item $item.FullName $destDir -Recurse -Force
              }
              Remove-Item $tmp -Recurse -Force
            }
          }

          @{
            type = "full"
            version = $version
            helperVersion = $version
            platform = "win-x64"
            includes = @("core", "impls", "runtime-jre")
            createdAt = (Get-Date -Format "o")
          } | ConvertTo-Json | Set-Content "$fullDir/manifest.json" -Encoding UTF8

          Compress-Archive -Path "$fullDir/*" -DestinationPath "dist/db-mcp-helper-full-win-x64-$version.zip"
          Write-Host "[OK] full package created"

      - name: Upload full package
        uses: actions/upload-artifact@v4
        with:
          name: full-package
          path: dist/db-mcp-helper-full-*.zip
          retention-days: 30

  # ─── Desktop installers (Tauri) — 3 platforms × 2 variants ───
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runs-on: windows-latest
            shell: pwsh
            variant: slim
          - platform: win-x64
            runs-on: windows-latest
            shell: pwsh
            variant: full
          - platform: macos-x64
            runs-on: macos-latest
            shell: bash
            variant: slim
          - platform: macos-x64
            runs-on: macos-latest
            shell: bash
            variant: full
          - platform: linux-x64
            runs-on: ubuntu-latest
            shell: bash
            variant: slim
          - platform: linux-x64
            runs-on: ubuntu-latest
            shell: bash
            variant: full
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    needs: [build-core, build-runtime]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      # ── Linux: install Tauri system dependencies ──
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Download core JARs
        uses: actions/download-artifact@v4
        with:
          name: core-jars

      - name: Download JRE runtime (full variant only)
        if: matrix.variant == 'full'
        uses: actions/download-artifact@v4
        with:
          name: jre-runtime-${{ matrix.platform }}
          path: dist/runtime

      # ── Stage Tauri bundle ──
      - name: Stage Tauri bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "shell/bundle"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item "db-mcp-setup.jar" "$bundle/db-mcp-setup.jar"
          if ("${{ matrix.variant }}" -eq "full" -and (Test-Path "dist/runtime")) {
            Copy-Item "dist/runtime" "$bundle/runtime" -Recurse -Force
            Write-Host "[OK] Bundled JRE staged (full variant)"
          } else {
            Write-Host "[OK] Slim variant — no JRE bundled"
          }

      - name: Stage Tauri bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p shell/bundle
          cp db-mcp-setup.jar shell/bundle/
          if [ "${{ matrix.variant }}" = "full" ] && [ -d "dist/runtime" ]; then
            cp -r dist/runtime shell/bundle/runtime
            echo "[OK] Bundled JRE staged (full variant)"
          else
            echo "[OK] Slim variant — no JRE bundled"
          fi

      # ── Build Tauri installer ──
      - name: Build Tauri installer
        working-directory: shell
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          npm install
          npx tauri build

      # ── Upload installer artifacts ──
      - name: Upload installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            shell/src-tauri/target/release/bundle/**/*.exe
            shell/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installer (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.variant }}
          path: shell/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installer (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.variant }}
          path: |
            shell/src-tauri/target/release/bundle/**/*.deb
            shell/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 30

  # ─── GitHub Release (tags only) ───
  release:
    runs-on: ubuntu-latest
    needs: [assemble, build-impls, build-runtime, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release

      - name: Flatten artifact layout
        run: |
          mkdir -p dist/upload
          find dist/release -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.msi" \
            -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) \
            -exec cp {} dist/upload/ \;

      - name: Generate checksums.txt
        run: |
          cd dist/upload
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
