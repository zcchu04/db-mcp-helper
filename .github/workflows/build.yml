name: Build and Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---- 安装平台特定依赖 ----
      # Inno Setup is pre-installed on windows-latest runners

      # ---- 克隆并构建 oracle-db-mcp-toolkit ----
      - name: Checkout oracle/mcp (sparse)
        uses: actions/checkout@v4
        with:
          repository: oracle/mcp
          path: oracle-mcp-src
          sparse-checkout: src/oracle-db-mcp-java-toolkit

      - name: Build oracle-db-mcp-toolkit
        shell: bash
        run: |
          set -e
          cd oracle-mcp-src/src/oracle-db-mcp-java-toolkit
          mvn clean package -DskipTests -q
          ls -lh target/

      # ---- 构建 mcp-tap ----
      - name: Build mcp-tap
        shell: bash
        run: mvn package -DskipTests -q -pl mcp-tap

      # ---- jlink MCP 精简运行时（供 MCP 服务器使用） ----
      - name: jlink MCP runtime
        shell: bash
        run: |
          set -e
          TOOLKIT=oracle-mcp-src/src/oracle-db-mcp-java-toolkit/target/oracle-db-mcp-toolkit-1.0.0.jar
          MODS=$(jdeps --ignore-missing-deps --print-module-deps "$TOOLKIT")
          FULL="java.base,java.logging,java.xml,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.rmi,java.sql,jdk.net,jdk.security.jgss"
          # 合并去重
          ALL=$(printf "%s,%s" "$FULL" "$MODS" | tr ',' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "Modules: $ALL"
          rm -rf dist/mcp-runtime
          jlink --add-modules "$ALL" --output dist/mcp-runtime \
            --strip-debug --no-header-files --no-man-pages --compress 2
          du -sh dist/mcp-runtime
          # 压缩
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path mcp-runtime -DestinationPath mcp-runtime.zip -Force"
          else
            zip -qr mcp-runtime.zip mcp-runtime
          fi
          cd ..

      # ---- jlink 安装器自身运行时 ----
      - name: jlink app runtime
        shell: bash
        run: |
          rm -rf dist/app-runtime
          jlink --add-modules java.base,java.desktop,java.logging,jdk.httpserver \
            --output dist/app-runtime --strip-debug --no-header-files --no-man-pages --compress 2
          du -sh dist/app-runtime

      # ---- 资源内嵌 + 构建 setup-app ----
      - name: Stage resources
        shell: bash
        run: |
          export TOOLKIT_SRC="$(pwd)/oracle-mcp-src/src/oracle-db-mcp-java-toolkit/target/oracle-db-mcp-toolkit-1.0.0.jar"
          chmod +x stage-resources.sh
          ./stage-resources.sh

      - name: Build setup-app (fat jar)
        shell: bash
        run: mvn package -DskipTests -q -pl setup-app

      - name: Prepare jpackage staging
        shell: bash
        run: |
          rm -rf dist/app-staging dist/pkg
          mkdir -p dist/app-staging
          cp setup-app/target/oracle-mcp-setup.jar dist/app-staging/

      # ---- jpackage 平台特定打包 ----
      - name: jpackage Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: |
          jpackage --type exe --name "Oracle MCP Helper" --app-version 1.0.0 \
            --vendor oraclemcp --input dist/app-staging \
            --main-jar oracle-mcp-setup.jar --main-class com.oraclemcp.setup.SetupMain \
            --runtime-image dist/app-runtime --dest dist/pkg \
            --icon design/icon.ico \
            --win-menu --win-shortcut --win-menu-group "Oracle MCP Helper" \
            --win-dir-chooser

      - name: jpackage macOS dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          jpackage --type dmg --name "Oracle MCP Setup" --app-version 1.0.0 \
            --vendor oraclemcp --input dist/app-staging \
            --main-jar oracle-mcp-setup.jar --main-class com.oraclemcp.setup.SetupMain \
            --runtime-image dist/app-runtime --dest dist/pkg

      - name: jpackage Linux deb + app-image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          jpackage --type deb --name "oracle-mcp-setup" --app-version 1.0.0 \
            --vendor oraclemcp --input dist/app-staging \
            --main-jar oracle-mcp-setup.jar --main-class com.oraclemcp.setup.SetupMain \
            --runtime-image dist/app-runtime --dest dist/pkg \
            --linux-menu-group "Development"
          jpackage --type app-image --name "Oracle MCP Setup" --app-version 1.0.0 \
            --vendor oraclemcp --input dist/app-staging \
            --main-jar oracle-mcp-setup.jar --main-class com.oraclemcp.setup.SetupMain \
            --runtime-image dist/app-runtime --dest dist/pkg

      # ---- 上传构建产物 ----
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-MCP-Setup-Windows
          path: |
            dist/pkg/**/*.exe
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-MCP-Setup-macOS
          path: |
            dist/pkg/**/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Oracle-MCP-Setup-Linux
          path: |
            dist/pkg/**/*.deb
            dist/pkg/**/Oracle MCP Setup/**
          if-no-files-found: error

  # ---- 创建 Release（仅 tag 推送时触发） ----
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release-files
          # 只复制安装包文件，排除 app-image 内部文件
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Oracle MCP Setup ${{ github.ref_name }}
          body: |
            ## Oracle MCP Setup ${{ github.ref_name }}

            三平台安装包：

            - **Windows**: `Oracle MCP Helper-1.0.0.exe`
            - **macOS**: `Oracle MCP Setup.dmg`
            - **Linux**: `oracle-mcp-setup_1.0.0-1_amd64.deb` + app-image

            ### 安装说明

            - **Windows**: 双击 `.exe` 安装，支持自定义安装目录
            - **macOS**: 打开 `.dmg`，拖入应用程序文件夹（首次打开需在系统设置中允许）
            - **Linux**: `sudo dpkg -i oracle-mcp-setup_1.0.0-1_amd64.deb` 或解压 app-image

            ### 首次使用

            1. 启动安装器，浏览器自动打开向导
            2. 部署运行时（内嵌精简 JRE，目标机无需安装 Java）
            3. 添加数据库环境（支持粘贴 Spring 配置片段）
            4. 自检连通性
            5. 注册到 AI 平台（QoderWork / Claude Code / Cursor 等）
          files: |
            release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
