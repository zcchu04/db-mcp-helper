  <path d="M165 120 L175 128 L165 136" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- AI/芯片节点 -->
  <rect x="175" y="108" width="40" height="40" rx="10" fill="#ffffff" opacity="0.95"/>
  <rect x="183" y="116" width="24" height="24" rx="4" fill="#1e40af"/>
  <!-- 芯片引脚 -->
  <line x1="189" y1="108" x2="189" y2="102" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="195" y1="108" x2="195" y2="102" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="201" y1="108" x2="201" y2="102" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="189" y1="148" x2="189" y2="154" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="195" y1="148" x2="195" y2="154" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="201" y1="148" x2="201" y2="154" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175" y1="118" x2="169" y2="118" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175" y1="128" x2="169" y2="128" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="175" y1="138" x2="169" y2="138" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="215" y1="118" x2="221" y2="118" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="215" y1="128" x2="221" y2="128" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="215" y1="138" x2="221" y2="138" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 齿轮/设置小图标（右下角） -->
