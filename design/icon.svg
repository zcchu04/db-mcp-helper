<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 240 240" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="conn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>

  <!-- 数据库圆柱体 -->
  <ellipse cx="100" cy="90" rx="42" ry="14" fill="#93c5fd" opacity="0.5"/>
  <rect x="58" y="90" width="84" height="76" fill="url(#db)" rx="0"/>
  <ellipse cx="100" cy="90" rx="42" ry="14" fill="url(#db)"/>
  <ellipse cx="100" cy="130" rx="42" ry="14" fill="#2563eb" opacity="0.4"/>
  <ellipse cx="100" cy="166" rx="42" ry="14" fill="#1d4ed8" opacity="0.6"/>

  <!-- 数据库内部线条 -->
  <line x1="70" y1="110" x2="130" y2="110" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="70" y1="130" x2="130" y2="130" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="70" y1="150" x2="130" y2="150" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- 连接桥/箭头 -->
