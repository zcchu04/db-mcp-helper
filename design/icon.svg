  <circle cx="195" cy="195" r="10" fill="none" stroke="#ffffff" stroke-width="3"/>
  <line x1="195" y1="178" x2="195" y2="183" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="195" y1="207" x2="195" y2="212" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="178" y1="195" x2="183" y2="195" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="207" y1="195" x2="212" y2="195" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="183" y1="183" x2="186.5" y2="186.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="203.5" y1="203.5" x2="207" y2="207" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="183" y1="207" x2="186.5" y2="203.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="203.5" y1="186.5" x2="207" y2="183" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
</svg>
