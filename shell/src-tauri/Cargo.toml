[package]
name = "db-mcp-helper"
version = "1.0.0"
description = "DB MCP Helper desktop shell"
authors = ["dbmcp"]
edition = "2021"

# Hide the console window on Windows release builds (the GUI is the WebView).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
