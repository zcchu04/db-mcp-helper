<style>
  :root { --pri:#2563eb; --pri-d:#1e40af; --ok:#16a34a; --err:#dc2626; --warn:#d97706; --bg:#f1f5f9; --card:#fff; --line:#e2e8f0; --tx:#0f172a; --tx2:#64748b; --sidebar-w:220px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--tx); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  header { background:#0f172a; color:#fff; padding:14px 28px; display:flex; align-items:center; gap:14px; flex-shrink:0; }
  header h1 { font-size:17px; font-weight:600; }
  header .sub { font-size:12px; color:#94a3b8; }
  .layout { display:flex; flex:1; min-height:0; }
  .sidebar { width:var(--sidebar-w); background:#fff; border-right:1px solid var(--line); padding:16px 0; flex-shrink:0; overflow-y:auto; }
  .sidebar .menu-section { margin-bottom:16px; }
  .sidebar .menu-title { font-size:11px; color:var(--tx2); text-transform:uppercase; padding:8px 16px; font-weight:600; letter-spacing:0.5px; }
  .sidebar .menu-item { display:block; padding:10px 16px; font-size:13px; color:var(--tx); text-decoration:none; cursor:pointer; border-left:3px solid transparent; transition:all 0.15s; }
  .sidebar .menu-item:hover { background:#f8fafc; color:var(--pri); }
  .sidebar .menu-item.active { background:#eff6ff; color:var(--pri); border-left-color:var(--pri); font-weight:500; }
  .sidebar .menu-item .icon { margin-right:8px; }
  main { flex:1; padding:24px; overflow-y:auto; min-width:0; min-height:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px 24px; margin-bottom:18px; }
  .card h2 { font-size:15px; margin-bottom:6px; }
  .card .desc { font-size:12.5px; color:var(--tx2); margin-bottom:14px; line-height:1.6; }
  label { display:block; font-size:13px; color:var(--tx2); margin:12px 0 5px; }
  input[type=text], input[type=password], input[type=number] { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13.5px; outline:none; }
  textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; outline:none; font-family:Consolas,monospace; resize:vertical; }
  input:focus, textarea:focus { border-color:var(--pri); }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  button { background:var(--pri); color:#fff; border:none; border-radius:6px; padding:8px 18px; font-size:13.5px; cursor:pointer; }
  button:hover { background:var(--pri-d); }
  button:disabled { background:#94a3b8; cursor:not-allowed; }
  button.ghost { background:#fff; color:var(--pri); border:1px solid var(--pri); }
  button.danger { background:var(--err); }
  button.small { padding:4px 10px; font-size:12px; }
  .steps { display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .steps span { padding:5px 12px; border-radius:999px; font-size:12px; background:#e2e8f0; color:var(--tx2); }
  .steps span.on { background:var(--pri); color:#fff; }
  .steps span.done { background:#dcfce7; color:var(--ok); }
  .result { margin-top:12px; padding:10px 12px; border-radius:6px; font-size:12.5px; display:none; line-height:1.7; word-break:break-all; }
  .result.ok { display:block; background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; }
  .result.err { display:block; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
  .result.info { display:block; background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; }
  pre { background:#0f172a; color:#e2e8f0; padding:12px; border-radius:6px; font-size:12px; overflow-x:auto; margin-top:8px; line-height:1.6; }
  .chk { display:flex; align-items:center; gap:8px; margin:7px 0; font-size:13.5px; cursor:pointer; }
  .chk input { width:15px; height:15px; }
  .tag { display:inline-flex; align-items:center; gap:5px; background:#e0e7ff; color:#3730a3; padding:3px 9px; border-radius:999px; font-size:12px; margin:3px 4px 0 0; }
  .tag b { cursor:pointer; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--tx2); font-weight:500; font-size:12px; }
  .badge { padding:2px 8px; border-radius:999px; font-size:11.5px; }
  .badge.ok { background:#dcfce7; color:#166534; }
  .badge.no { background:#fee2e2; color:#991b1b; }
  .badge.warn { background:#fef3c7; color:#92400e; }
  #toast { position:fixed; top:18px; right:18px; z-index:99; display:flex; flex-direction:column; gap:8px; }
  #toast div { padding:10px 16px; border-radius:8px; color:#fff; font-size:13px; box-shadow:0 4px 14px rgba(0,0,0,.15); animation:fade .25s; }
  @keyframes fade { from{opacity:0; transform:translateY(-6px)} to{opacity:1} }
  .kv { font-size:13px; line-height:2; }
  .kv b { color:var(--tx2); font-weight:500; margin-right:8px; }
  details { margin-top:10px; font-size:13px; }
  summary { cursor:pointer; color:var(--pri); font-size:13px; }
  .hint { font-size:12px; color:var(--tx2); margin-top:6px; line-height:1.6; }
</style>
</head>

<header>
  <h1>Oracle MCP 安装向导</h1>
  <span class="sub" id="hd-sub">加载中…</span>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar" style="display:none">
    <div class="menu-section">

    <div class="menu-section">

    </div>
    <div class="menu-section">
      <div class="menu-title">系统信息</div>

      <div class="menu-title">高级操作</div>

<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
let DET = null;            // detect 结果
let CUR_ENV = null;        // 当前向导操作的实例编码
const DEFAULT_ALIASES = {
  local:["本地"], dev:["开发","development"], test:["测试","SIT"],
  uat:["UAT","验收","用户测试"], preprod:["预发","准生产"], prod:["生产","线上","正式","PRD"]
};
const ENV_CODES = Object.keys(DEFAULT_ALIASES);

// ---------- 基础工具 ----------
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : undefined);
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "请求失败");
  return j.data;
}
function toast(msg, type){
  const d = document.createElement("div");
  d.textContent = msg;
  d.style.background = type==="err" ? "var(--err)" : type==="warn" ? "var(--warn)" : "var(--ok)";
  $("#toast").appendChild(d);
  setTimeout(()=>d.remove(), 3500);
}
function setResult(id, ok, html){
  const el = $(id);
  el.className = "result " + (ok===null ? "info" : ok ? "ok" : "err");
  el.innerHTML = html;
}
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast("已复制到剪贴板"); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("已复制到剪贴板"); }
}
function state(){ return DET && DET.state; }

// ---------- 入口 ----------
async function boot(){
  try { DET = await api("/api/detect"); }
  catch(e){ $("#app").innerHTML = "<div class='card'><h2>检测失败</h2><p>"+esc(e.message)+"</p></div>"; return; }

// ---------- 菜单栏路由 ----------
function initMenu(){
  const sidebar = $("#sidebar");
  if(!sidebar) return;
  sidebar.style.display = "block";
  
  document.querySelectorAll(".menu-item").forEach(item => {
    item.onclick = (e) => {
      e.preventDefault();
      document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("active"));
      item.classList.add("active");
      const route = item.dataset.route;
      navigateTo(route);
    };
  });
}

function setActiveMenu(route){
  document.querySelectorAll(".menu-item").forEach(i => i.classList.remove("active"));
  const target = document.querySelector(`[data-route="${route}"]`);
  if(target) target.classList.add("active");
}

function showSidebar(show){
  const sidebar = $("#sidebar");
  if(sidebar) sidebar.style.display = show ? "block" : "none";
}

function navigateTo(route){
  showSidebar(true);
  switch(route){
    case "env-list": renderConsole(); setActiveMenu("env-list"); break;
    case "env-add": renderWizard(2); setActiveMenu("env-add"); break;
    case "skill": renderSkillPage(); setActiveMenu("skill"); break;
    case "skill-guide": renderSkillGuide(); setActiveMenu("skill-guide"); break;
    case "system": renderSystemInfo(); setActiveMenu("system"); break;
    case "danger": renderDangerZone(); setActiveMenu("danger"); break;
    default: renderConsole(); setActiveMenu("env-list");
  }
}

function render(){
  if(state() && Object.keys(state().envs).length){
    renderConsole();
    setActiveMenu("env-list");
  } else {
    renderWizard(1);
    showSidebar(false);
  }
}

// ---------- 危险区（清空/卸载） ----------
function dangerZone(){
  return `<div class="card" style="border-color:#fecaca">
  <h2 style="color:var(--err)">危险区</h2>
  <p class="desc">一键清空：删除所有已写入的数据（运行时、全部实例配置与调用日志、mcp.json 中注册的连接器、已部署的 Skill），回到从未操作过的初始状态，<b>保留安装程序本身</b>。<br>一键卸载：先执行一键清空，再移除安装程序自身（均可在回收站找回）。</p>
  <button class="danger" id="dz-reset">一键清空</button>
  <button class="danger" id="dz-uninstall" style="margin-left:10px;background:#7f1d1d">一键卸载</button>
  <div class="result" id="dz-r"></div>
</div>`;
}
function bindDanger(){
  const zr = $("#dz-reset"), zu = $("#dz-uninstall");
  if(!zr) return;
  zr.onclick = async () => {
    if(!confirm("确认一键清空？\n\n将删除：运行时文件、全部实例配置与调用日志、mcp.json 中的 oracle-* 连接器、所有已部署的 Skill 副本。\n（全部移入回收站，可找回；安装程序保留）")) return;
    zr.disabled = true; zr.textContent = "清空中…";
    try {
      const r = await api("/api/reset", {});
      setResult("#dz-r", true, "已清空：" + r.mcpRemoved + " 个连接器条目 · " + (r.skillTrashed||[]).length + " 份 Skill · 根目录 " + esc(r.rootTrashed));
      DET = await api("/api/detect");
      setTimeout(render, 1200);
    } catch(e){ setResult("#dz-r", false, esc(e.message)); zr.disabled=false; zr.textContent="一键清空"; }
  };
  zu.onclick = async () => {
    if(!confirm("确认一键卸载？\n\n将清空全部数据（同「一键清空」），并移除安装程序自身。\n此操作后本向导将自动退出。")) return;
    if(!confirm("再次确认：一键卸载将删除所有数据与安装程序（均移入回收站）。继续？")) return;
    zu.disabled = true; zu.textContent = "卸载中…";

    } catch(e){ setResult("#dz-r", false, esc(e.message)); zu.disabled=false; zu.textContent="一键卸载"; }
  };
}

  const steps = ["部署运行时","添加实例","连通自检","注册启用","部署 Skill","完成"];
  let html = "<div class='steps'>" + steps.map((s,i)=>`<span class="${i+1===step?"on":i+1<step?"done":""}">${i+1}. ${s}</span>`).join("") + "</div>";
  html += WIZ[step]();

}

    <div class="kv"><b>QoderWork mcp.json</b>${esc(DET.mcpJsonPath)}（当前 oracle-* 条目：${esc((DET.registeredServers||[]).join(", ")||"无")}）</div>
    <div class="kv"><b>IDEA Qoder 插件 mcp.json</b>${esc(DET.qoderPluginMcpJsonPath)}（当前 oracle-* 条目：${esc((DET.qoderPluginRegisteredServers||[]).join(", ")||"无")}）</div>
  </div>
  ${dangerZone()}`;
  $("#c-add").onclick = ()=>navigateTo("env-add");
  $("#c-sync").onclick = async () => {
    try { const r = await api("/api/skill/sync", {}); setResult("#c-r", true, "已同步 " + r.updated.length + " 份映射：<br>"+r.updated.map(d=>"• "+esc(d)).join("<br>")); }
    catch(e){ setResult("#c-r", false, esc(e.message)); }
  };
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick = async ()=>{
    const env = b.dataset.env, act = b.dataset.act;

      if(act==="test"){

        const t = await api("/api/env/test",{env});
        t.ok ? toast(env+" 自检通过："+t.detail) : toast(env+" 自检失败："+t.detail,"err");
        renderConsole();
      } else if(act==="reg"){
        const r = await api("/api/env/register",{env});
        setResult("#c-r", true, "已注册 "+esc(r.serverName)+"，请重启 QoderWork 或对该连接器 disable→enable 生效");

        const r = await api("/api/env/log?env="+encodeURIComponent(env)+"&limit=100");

        for(const line of r.lines){
          try { const j = JSON.parse(line);
            body += `${j.ts.replace("T"," ").substring(0,19)}  ${j.tool.padEnd(14)} ${String(j.durMs).padStart(6)}ms  ${j.error?"✗ 错误":"✓"}  ${j.sql?esc(j.sql):""}\n`;
          } catch(e){ body += line+"\n"; }
        }
        $("#app").innerHTML = `<div class="card"><h2>调用日志 — ${esc(env)}</h2>
          <p class="desc">来源：${esc(r.logPath)}（最新在前，最多 100 条）。由 tap 监听代理旁路记录，协议流本身不受影响。</p>
          <pre>${body||"（暂无调用记录）"}</pre>
          <div style="margin-top:14px"><button class="ghost" id="lg-back">返回管理台</button></div></div>`;

        if(!confirm("删除实例 "+env+"？\n将移除 mcp.json 中的 oracle-"+env+" 条目，实例配置目录移入回收站，并同步更新 Skill 映射。")) return;

    try {

        list.innerHTML = '<div class="hint">暂无已部署的 skill 位置</div>';
        return;
      }
      list.innerHTML = r.targets.map((t, i) => `
        <div style="display:flex; align-items:center; gap:10px; margin:8px 0; padding:8px 12px; background:#f8f9fa; border-radius:6px">

          <button class="danger small" data-skill-idx="${i}">删除</button>
        </div>
      `).join("");
      list.querySelectorAll("[data-skill-idx]").forEach(btn => {
        btn.onclick = async () => {
          const idx = +btn.dataset.skillIdx;
          const target = r.targets[idx];
          if (!confirm("删除 skill 位置 " + target + "？\n将移除该目录下的 oracle-db-ops skill 副本（移入回收站）。")) return;
          try {
            await api("/api/skill/targets", {action:"remove", target});
            toast("已删除 " + target);
            renderSkillTargets();
          } catch(e) { toast(e.message, "err"); }
        };
      });
    } catch(e) { console.error(e); }
  };

  // AI 平台预设列表
  const AI_PLATFORMS = [
    { name: "QoderWork", path: "/.qoderwork/skills" },
    { name: "跨 Agent 共享（Cursor/Gemini 等）", path: "/.agents/skills" },
    { name: "Claude Code", path: "/.claude/skills" },
    { name: "Codex CLI", path: "/.codex/skills" },
    { name: "Gemini CLI", path: "/.gemini/skills" },
    { name: "Cursor", path: "/.cursor/skills" }
  ];

  // 动态生成 AI 平台下拉选项（已部署的置灰）
  const populateAiDropdown = async () => {
    const dropdown = $("#skill-ai-dropdown");
    dropdown.innerHTML = '<option value="">-- 选择 AI 平台 --</option>';
    
    try {
      const r = await api("/api/skill/targets");
      const deployed = new Set(r.targets || []);
      
      AI_PLATFORMS.forEach(platform => {
        const fullPath = DET.home.replace(/\\/g, "/") + platform.path;
        const isDeployed = deployed.has(fullPath);
        
        const option = document.createElement("option");
        option.value = fullPath;
        option.textContent = platform.name + (isDeployed ? " (已部署)" : "");
        if (isDeployed) {
          option.disabled = true;
          option.style.color = "#999";
        }
        dropdown.appendChild(option);
      });
    } catch(e) {
      console.error("Failed to populate AI dropdown:", e);
    }
  };

  // 新增 skill 位置 - 显示/隐藏面板
  const showAddPanel = async (mode) => {
    $("#skill-add-panel").style.display = "block";
    $("#skill-ai-select").style.display = mode === "ai" ? "block" : "none";
    $("#skill-picker-select").style.display = mode === "picker" ? "block" : "none";
    $("#skill-input-select").style.display = mode === "input" ? "block" : "none";
    
    if (mode === "ai") {
      await populateAiDropdown();
    }
  };

  $("#add-skill-by-ai").onclick = () => showAddPanel("ai");
  $("#add-skill-by-picker").onclick = () => {
    showAddPanel("picker");
    $("#skill-folder-picker").click();
  };
  $("#add-skill-by-input").onclick = () => showAddPanel("input");

  // 文件选择器处理
  $("#skill-folder-picker").onchange = (e) => {
    const files = e.target.files;
    if (files && files.length > 0) {
      // webkitdirectory 返回的是目录下的文件，取第一个文件的路径作为目录
      const path = files[0].webkitRelativePath || files[0].path;
      const dirPath = path.split("/")[0] || path.split("\\")[0];
      $("#skill-picker-path").value = dirPath;
    }
  };

  // 浏览按钮
  $("#skill-picker-btn").onclick = () => {
    $("#skill-folder-picker").click();
  };

  // 确认添加 - AI 选择
  $("#skill-ai-confirm").onclick = async () => {
    const target = $("#skill-ai-dropdown").value;
    if (!target) { toast("请选择 AI 平台", "warn"); return; }
    try {
      await api("/api/skill/targets", {action:"add", target});
      toast("已新增 " + target);
      $("#skill-add-panel").style.display = "none";
      renderSkillTargets();
    } catch(e) { toast(e.message, "err"); }
  };

  // 确认添加 - 目录选择
  $("#skill-picker-confirm").onclick = async () => {
    const target = $("#skill-picker-path").value.trim();
    if (!target) { toast("请选择目录", "warn"); return; }
    try {
      await api("/api/skill/targets", {action:"add", target});
      toast("已新增 " + target);
      $("#skill-add-panel").style.display = "none";
      $("#skill-picker-path").value = "";
      renderSkillTargets();
    } catch(e) { toast(e.message, "err"); }
  };

  // 确认添加 - 手动输入
  $("#skill-input-confirm").onclick = async () => {
    const target = $("#skill-input-path").value.trim();
    if (!target) { toast("请输入目录路径", "warn"); return; }
    try {
      await api("/api/skill/targets", {action:"add", target});
      toast("已新增 " + target);
      $("#skill-add-panel").style.display = "none";
      $("#skill-input-path").value = "";
      renderSkillTargets();
    } catch(e) { toast(e.message, "err"); }
  };

  renderSkillTargets();

  bindDanger();
}

// ---------- 接入指南 ----------
async function renderGuide(env){
  let r;
  try { r = await api("/api/env/guide?env="+encodeURIComponent(env)); }
  catch(e){ toast(e.message,"err"); return; }
  let cur = 0;
  const chips = () => r.platforms.map((p,i)=>`<button class="${i===cur?"":"ghost"} small" data-pi="${i}" style="margin:0 6px 6px 0">${esc(p.name)}</button>`).join("");
  const detail = () => {
    const p = r.platforms[cur];
    $("#gd-detail").innerHTML = `
      <div class="kv"><b>配置位置</b>${esc(p.configLocation)}</div>
      <div style="margin:10px 0">
        <button class="small" id="gd-copy">复制配置模板</button>
        ${p.deeplink?`<button class="ghost small" id="gd-open" style="margin-left:8px">打开配置页</button>`:""}
      </div>
      <pre id="gd-tpl">${esc(p.template)}</pre>
      <div class="hint" style="margin-top:10px;line-height:2">操作步骤：<br>${p.steps.map((s,i)=>(i+1)+". "+esc(s)).join("<br>")}</div>`;
    $("#gd-copy").onclick = ()=>copyText(p.template);
    if(p.deeplink) $("#gd-open").onclick = ()=>{ location.href = p.deeplink; };
  };
  $("#app").innerHTML = `<div class="card"><h2>接入指南 — ${esc(env)}</h2>
    <p class="desc">选择你的 AI 平台，复制已预填该实例注册命令的配置模板。连接器名：<b>${esc(r.serverName)}</b>。QoderWork 本机已由安装器自动写入 mcp.json，其他平台按下述方式接入。</p>
    <div id="gd-chips">${chips()}</div>
    <div id="gd-detail"></div>
    <div style="margin-top:16px"><button class="ghost" id="gd-back">返回管理台</button></div></div>`;
  detail();
  $("#gd-chips").onclick = e => { const b = e.target.closest("[data-pi]"); if(!b) return; cur = +b.dataset.pi; $("#gd-chips").innerHTML = chips(); detail(); };
  $("#gd-back").onclick = () => navigateTo("env-list");
}

      <li><b>写操作确认</b>：展示完整 SQL + 影响范围 + 获得用户明确确认</li>
      <li><b>大表防护</b>：COUNT/全表扫描前先评估，大表禁止 SELECT *</li>
      <li><b>密码保护</b>：禁止在对话中回显数据库密码</li>
    </ul>

    <h3 style="margin-top:20px; font-size:14px; color:var(--pri)">💬 使用示例</h3>
    <pre style="margin-top:10px">-- 查询表结构
在 uat 查一下 EC_REBATE_DETAIL_HEAD 的表结构

-- 受控写操作（需确认）
